name: Original-free CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate public staged sources
        run: python3 -B scripts/source_policy.py
      - name: Prepare isolated Python and pinned assembler
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt
          .venv/bin/python -B scripts/ci_setup.py
      - name: Run complete original-free tests
        run: |
          mkdir -p outputs/ci
          .venv/bin/python -B -m unittest discover -s tests -v > outputs/ci/tests.log 2>&1 || { cat outputs/ci/tests.log; exit 1; }
          tail -5 outputs/ci/tests.log
      - name: Repeat diagnostic build and verify published byte identity
        run: .venv/bin/python -B scripts/ci_verify.py
      - name: Build original-free SCREEN2 renderer diagnostic
        run: make render-build
      - name: Preserve synthetic reports only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/ci/tests.log
            outputs/diagnostic/build.json
            outputs/diagnostic/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
