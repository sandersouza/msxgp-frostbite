name: Original-free CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate public staged sources
        run: python3 -B scripts/source_policy.py
      - name: Prepare isolated Python
        run: |
          python3 -m venv .venv
      - name: Run essential maintenance checks
        run: |
          mkdir -p outputs/ci
          make ci-verify > outputs/ci/tests.log 2>&1 || { cat outputs/ci/tests.log; exit 1; }
          tail -5 outputs/ci/tests.log
      - name: Build and compare all native formats
        run: |
          make verify > outputs/ci/build.log 2>&1 || { tail -80 outputs/ci/build.log; exit 1; }
          tail -40 outputs/ci/build.log
      - name: Preserve native artifacts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/ci/*.log
            outputs/native/cartridge/FROSTBIT.ROM
            outputs/native/disk/FROSTBIT.COM
            outputs/native/disk/FROSTBIT.BIN
            outputs/native/disk/FBGFX.BIN
            outputs/native/disk/FROSTBIT.BAS
          if-no-files-found: warn
          retention-days: 14
